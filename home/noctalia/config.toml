[backdrop]
blur_intensity = 0.5
enabled = true
tint_intensity = 0.3

[bar.default]
background_opacity = 0.25
capsule = true
capsule_padding = 10.0
capsule_thickness = 0.75
font_family = "Noto Sans CJK TC"
margin_edge = 0
margin_ends = 0
padding = 10
radius = 0
thickness = 40
widget_spacing = 5
center = ["workspaces"]
end = ["tray", "group:g1", "clock"]

[bar.default.monitor.dp1]
match = "DP-1"
enabled = true
start = ["control-center", "screenshot", "cpu", "ram", "media"]

[[bar.default.capsule_group]]
enabled = true
fill = "surface_container"
id = "g1"
members = ["clipboard", "notifications"]
opacity = 1.0
padding = 15.0
widget_spacing = 10

[widget.screenshot]
glyph = "screenshot"

[widget.cpu]
type = "sysmon"
stat = "cpu_usage"
visualization = "none"

[widget.ram]
type = "sysmon"
stat = "ram_used"
visualization = "none"

[widget.workspaces]
hide_when_empty = true
scale = 1.2

[widget.clock]
format = "%b%e日%A  %p %I : %M"

[desktop_widgets]
schema_version = 2
widget_order = []

[desktop_widgets.grid]
cell_size = 16
major_interval = 4
visible = true

[shell]
font_family = "Noto Sans CJK TC"
lang = "zh-Hant"

[shell.launcher]
compact = true

[location]
auto_locate = false
address     = "Taipei"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = ["lockscreen-login-box@DP-1"]

[lockscreen_widgets.grid]
cell_size = 16
major_interval = 4
visible = true

[lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
box_height = 229.0
box_width = 810.0
cx = 1536.0
cy = 1529.5
output = "DP-1"
rotation = 0.0
type = "login_box"

[lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
background_color = "surface_variant"
background_opacity = 0.88
background_radius = 12.0
center_password_text = false
input_opacity = 1.0
input_radius = 6.0
layout = "regular"
show_caps_lock = true
show_keyboard_layout = true
show_login_button = true
show_media = true
show_session_buttons = true
show_weather = true

[osd]
monitors = ["DP-1"]
position = "top_right"

[osd.kinds]
keyboard_layout = false

[theme]
builtin = "Noctalia"
community_palette = "Doomed"
mode = "light"
source = "builtin"
wallpaper_scheme = "m3-tonal-spot"

[theme.templates]
builtin_ids = ["btop", "gtk3", "gtk4", "niri", "qt"]
community_ids = ["zen-browser", "telegram", "vscode"]

[wallpaper]
directory = "~/Pictures/wallpapers"
enable = true
per_monitor_directories = true

[wallpaper.automation]
enabled = true
interval_seconds = 900

[wallpaper.monitor.DP-1]
directory = "~/Pictures/wallpapers/horizontal"

[weather]
enabled         = true
refresh_minutes = 30
unit            = "metric"
effects         = true
